name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Verify and publish release assets
    runs-on: macos-latest

    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.3.1

      - name: Verify scripts and specs
        run: |
          python3 scripts/test_codex_profile_switch.py
          python3 -m py_compile scripts/*.py
          bash -n scripts/codex-switch
          bash -n scripts/codex_env_setup
          bash -n install.sh
          bash -n run.sh
          python3 -m json.tool evals/evals.json >/dev/null
          openspec validate --all --strict --json

      - name: Package release bundle
        run: |
          scripts/package-release.sh
          test -x dist/run.sh
          test -x dist/codex-switch/run.sh
          test -f dist/codex-switch.tar.gz

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" \
            install.sh \
            dist/run.sh \
            dist/codex-switch.tar.gz \
            --clobber
