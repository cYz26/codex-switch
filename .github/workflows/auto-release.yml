name: Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  auto-release:
    name: Plan, tag, and publish release
    runs-on: macos-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.3.1

      - name: Plan automatic release
        id: plan
        run: |
          python3 scripts/release_auto.py plan --json --github-output "$GITHUB_OUTPUT"

      - name: Print release plan
        run: |
          echo "release_required=${{ steps.plan.outputs.release_required }}"
          echo "latest_tag=${{ steps.plan.outputs.latest_tag }}"
          echo "next_tag=${{ steps.plan.outputs.next_tag }}"
          echo "release_files=${{ steps.plan.outputs.release_files }}"

      - name: Bump release version
        if: steps.plan.outputs.release_required == 'true'
        env:
          NEXT_TAG: ${{ steps.plan.outputs.next_tag }}
        run: |
          python3 scripts/release_auto.py bump --tag "$NEXT_TAG"

      - name: Verify release source
        if: steps.plan.outputs.release_required == 'true'
        run: |
          python3 scripts/test_codex_profile_switch.py
          python3 -m py_compile scripts/*.py
          bash -n scripts/codex-switch
          bash -n scripts/codex_env_setup
          bash -n install.sh
          bash -n run.sh
          python3 -m json.tool evals/evals.json >/dev/null
          openspec validate --all --strict --json

      - name: Commit version and create tag
        if: steps.plan.outputs.release_required == 'true'
        env:
          NEXT_TAG: ${{ steps.plan.outputs.next_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- VERSION; then
            git add VERSION
            git commit -m "chore: release $NEXT_TAG"
          fi
          git tag "$NEXT_TAG"
          git push origin "HEAD:main" "refs/tags/$NEXT_TAG"

      - name: Package release bundle
        if: steps.plan.outputs.release_required == 'true'
        run: |
          scripts/package-release.sh
          test -x dist/run.sh
          test -x dist/codex-switch/run.sh
          test -f dist/codex-switch.tar.gz

      - name: Publish release assets
        if: steps.plan.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.plan.outputs.next_tag }}
        run: |
          if ! gh release view "$NEXT_TAG" >/dev/null 2>&1; then
            gh release create "$NEXT_TAG" --title "$NEXT_TAG" --notes "Release $NEXT_TAG"
          fi
          gh release upload "$NEXT_TAG" \
            install.sh \
            dist/run.sh \
            dist/codex-switch.tar.gz \
            --clobber
