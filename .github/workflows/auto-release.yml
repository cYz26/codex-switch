name: Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-switch-release
  cancel-in-progress: false

jobs:
  auto-release:
    name: Plan, tag, and publish release
    runs-on: macos-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Stage trusted release tooling
        run: |
          install -d "$RUNNER_TEMP/codex-switch-release-tools"
          install -m 0644 \
            scripts/release_auto.py \
            scripts/codex_switch_release_bundle.py \
            "$RUNNER_TEMP/codex-switch-release-tools/"
          echo "RELEASE_AUTO=$RUNNER_TEMP/codex-switch-release-tools/release_auto.py" \
            >> "$GITHUB_ENV"

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.3.1

      - name: Plan automatic release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 "$RELEASE_AUTO" plan \
            --abandon-tag v0.1.14 \
            --github-repo "$GITHUB_REPOSITORY" \
            --json \
            --github-output "$GITHUB_OUTPUT"

      - name: Print release plan
        run: |
          echo "release_required=${{ steps.plan.outputs.release_required }}"
          echo "release_action=${{ steps.plan.outputs.release_action }}"
          echo "reconcile_required=${{ steps.plan.outputs.reconcile_required }}"
          echo "prepare_required=${{ steps.plan.outputs.prepare_required }}"
          echo "latest_tag=${{ steps.plan.outputs.latest_tag }}"
          echo "target_tag=${{ steps.plan.outputs.target_tag }}"
          echo "target_commit=${{ steps.plan.outputs.target_commit }}"
          echo "missing_assets=${{ steps.plan.outputs.missing_assets }}"
          echo "next_tag=${{ steps.plan.outputs.next_tag }}"
          echo "abandoned_tag=${{ steps.plan.outputs.abandoned_tag }}"
          echo "release_files=${{ steps.plan.outputs.release_files }}"

      - name: Check out release reconciliation commit
        if: steps.plan.outputs.reconcile_required == 'true'
        env:
          TARGET_COMMIT: ${{ steps.plan.outputs.target_commit }}
        run: git checkout --detach "$TARGET_COMMIT"

      - name: Verify reconciliation source
        if: steps.plan.outputs.reconcile_required == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/codex-switch-pycache-reconcile
        run: |
          if ! python3 scripts/test_codex_profile_switch.py; then
            echo "::warning::Profile/Wrapper verification failed on the first attempt; retrying once with verbose diagnostics."
            profile_log="$RUNNER_TEMP/codex-switch-profile-wrapper.log"
            if python3 scripts/test_codex_profile_switch.py -v >"$profile_log" 2>&1; then
              cat "$profile_log"
            else
              profile_status=$?
              cat "$profile_log"
              profile_error="$(tail -n 120 "$profile_log")"
              profile_error="${profile_error//%/%25}"
              profile_error="${profile_error//$'\r'/%0D}"
              profile_error="${profile_error//$'\n'/%0A}"
              echo "::error title=Profile/Wrapper verification failed after retry::$profile_error"
              exit "$profile_status"
            fi
          fi
          if [ -f scripts/test_codex_update_release.py ]; then
            python3 scripts/test_codex_update_release.py
          else
            echo "::notice::Historical release source has no scripts/test_codex_update_release.py; trusted asset validation remains required."
          fi
          python3 -m py_compile scripts/*.py
          bash -n scripts/codex-switch
          bash -n scripts/codex_env_setup
          bash -n install.sh
          bash -n run.sh
          python3 -m json.tool evals/evals.json >/dev/null
          openspec validate --all --strict --json

      - name: Package reconciliation bundle
        if: steps.plan.outputs.reconcile_required == 'true'
        env:
          CODEX_SWITCH_DIST_DIR: ${{ runner.temp }}/codex-switch-reconcile-dist
        run: |
          scripts/package-release.sh
          test -x "$CODEX_SWITCH_DIST_DIR/run.sh"
          test -x "$CODEX_SWITCH_DIST_DIR/codex-switch/run.sh"
          test -f "$CODEX_SWITCH_DIST_DIR/codex-switch.tar.gz"

      - name: Validate reconciliation assets
        if: steps.plan.outputs.reconcile_required == 'true'
        env:
          ASSET_MANIFEST: ${{ runner.temp }}/codex-switch-reconcile-assets.json
          RECONCILE_DIST: ${{ runner.temp }}/codex-switch-reconcile-dist
          TARGET_TAG: ${{ steps.plan.outputs.target_tag }}
        run: |
          python3 "$RELEASE_AUTO" assets \
            --tag "$TARGET_TAG" \
            --commit HEAD \
            --dist-dir "$RECONCILE_DIST" \
            --manifest "$ASSET_MANIFEST" \
            --require-tag \
            --allow-legacy \
            --json

      - name: Reconcile existing release assets
        if: steps.plan.outputs.reconcile_required == 'true'
        env:
          ASSET_MANIFEST: ${{ runner.temp }}/codex-switch-reconcile-assets.json
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_COMMIT: ${{ steps.plan.outputs.target_commit }}
          TARGET_TAG: ${{ steps.plan.outputs.target_tag }}
        run: |
          GIT_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="$GIT_AUTH_HEADER"
          python3 "$RELEASE_AUTO" reconcile \
            --tag "$TARGET_TAG" \
            --commit "$TARGET_COMMIT" \
            --remote origin \
            --manifest "$ASSET_MANIFEST" \
            --github-repo "$GITHUB_REPOSITORY" \
            --json

      - name: Restore original source commit
        if: steps.plan.outputs.prepare_required == 'true'
        env:
          SOURCE_COMMIT: ${{ steps.plan.outputs.source_commit }}
        run: git checkout --detach "$SOURCE_COMMIT"

      - name: Bump release version
        if: steps.plan.outputs.prepare_required == 'true'
        env:
          NEXT_TAG: ${{ steps.plan.outputs.next_tag }}
        run: |
          python3 "$RELEASE_AUTO" bump --tag "$NEXT_TAG"

      - name: Verify release source
        if: steps.plan.outputs.prepare_required == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/codex-switch-pycache-prepare
        run: |
          if ! python3 scripts/test_codex_profile_switch.py; then
            echo "::warning::Profile/Wrapper verification failed on the first attempt; retrying once with verbose diagnostics."
            profile_log="$RUNNER_TEMP/codex-switch-profile-wrapper.log"
            if python3 scripts/test_codex_profile_switch.py -v >"$profile_log" 2>&1; then
              cat "$profile_log"
            else
              profile_status=$?
              cat "$profile_log"
              profile_error="$(tail -n 120 "$profile_log")"
              profile_error="${profile_error//%/%25}"
              profile_error="${profile_error//$'\r'/%0D}"
              profile_error="${profile_error//$'\n'/%0A}"
              echo "::error title=Profile/Wrapper verification failed after retry::$profile_error"
              exit "$profile_status"
            fi
          fi
          test -f scripts/test_codex_update_release.py
          python3 scripts/test_codex_update_release.py
          python3 -m py_compile scripts/*.py
          bash -n scripts/codex-switch
          bash -n scripts/codex_env_setup
          bash -n install.sh
          bash -n run.sh
          python3 -m json.tool evals/evals.json >/dev/null
          openspec validate --all --strict --json

      - name: Commit release version locally
        if: steps.plan.outputs.prepare_required == 'true'
        env:
          NEXT_TAG: ${{ steps.plan.outputs.next_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          if git diff --cached --quiet; then
            echo "VERSION did not change for $NEXT_TAG" >&2
            exit 1
          fi
          git commit -m "chore: release $NEXT_TAG"

      - name: Package release bundle
        if: steps.plan.outputs.prepare_required == 'true'
        env:
          CODEX_SWITCH_DIST_DIR: ${{ runner.temp }}/codex-switch-pending-dist
        run: |
          scripts/package-release.sh
          test -x "$CODEX_SWITCH_DIST_DIR/run.sh"
          test -x "$CODEX_SWITCH_DIST_DIR/codex-switch/run.sh"
          test -f "$CODEX_SWITCH_DIST_DIR/codex-switch.tar.gz"

      - name: Validate deterministic release assets
        if: steps.plan.outputs.prepare_required == 'true'
        env:
          ASSET_MANIFEST: ${{ runner.temp }}/codex-switch-pending-assets.json
          PENDING_DIST: ${{ runner.temp }}/codex-switch-pending-dist
          TARGET_TAG: ${{ steps.plan.outputs.next_tag }}
        run: |
          python3 "$RELEASE_AUTO" assets \
            --tag "$TARGET_TAG" \
            --commit HEAD \
            --dist-dir "$PENDING_DIST" \
            --manifest "$ASSET_MANIFEST" \
            --json

      - name: Confirm remote base before release refs
        if: steps.plan.outputs.prepare_required == 'true'
        env:
          ASSET_MANIFEST: ${{ runner.temp }}/codex-switch-pending-assets.json
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.plan.outputs.next_tag }}
          SOURCE_COMMIT: ${{ steps.plan.outputs.source_commit }}
        run: |
          GIT_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)"
          git -c http.https://github.com/.extraheader="$GIT_AUTH_HEADER" \
            fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            --tags
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="$GIT_AUTH_HEADER"
          python3 "$RELEASE_AUTO" prepare \
            --tag "$NEXT_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --candidate-commit HEAD \
            --remote-ref refs/remotes/origin/main \
            --manifest "$ASSET_MANIFEST" \
            --json

      - name: Create and atomically push release refs
        if: steps.plan.outputs.prepare_required == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.plan.outputs.next_tag }}
          SOURCE_COMMIT: ${{ steps.plan.outputs.source_commit }}
        run: |
          GIT_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)"
          git tag "$NEXT_TAG"
          git -c http.https://github.com/.extraheader="$GIT_AUTH_HEADER" \
            push --atomic origin \
            --force-with-lease="refs/heads/main:$SOURCE_COMMIT" \
            --force-with-lease="refs/tags/$NEXT_TAG:" \
            "HEAD:refs/heads/main" \
            "refs/tags/$NEXT_TAG:refs/tags/$NEXT_TAG"

      - name: Reconcile and verify release assets
        if: steps.plan.outputs.prepare_required == 'true'
        env:
          ASSET_MANIFEST: ${{ runner.temp }}/codex-switch-pending-assets.json
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_TAG: ${{ steps.plan.outputs.next_tag }}
        run: |
          GIT_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="$GIT_AUTH_HEADER"
          python3 "$RELEASE_AUTO" reconcile \
            --tag "$TARGET_TAG" \
            --commit HEAD \
            --remote origin \
            --manifest "$ASSET_MANIFEST" \
            --github-repo "$GITHUB_REPOSITORY" \
            --json
